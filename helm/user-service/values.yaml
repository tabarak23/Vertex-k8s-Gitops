namespace: user-service

image:
  repository: <ECR_REPO>
  tag: latest

replicaCount: 2

service:
  port: 80
  targetPort: 8001

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPU: 60

ingress:
  enabled: true
  host: user.example.com
  certificateArn: arn:aws:acm:REGION:ACCOUNT:certificate/xxxx

secrets:
  awsRegion: us-west-1
  secretPath: prod/user-service/db

irsa:
  roleArn: arn:aws:iam::<ACCOUNT_ID>:role/user-service-irsa-role
namespace: user-service

image:
  repository: user-service
  tag: "1.0"

replicaCount: 2

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPU: 50

ingress:
  enabled: true
  host: user.local

aws:
  enabled: false

externalSecrets:
  enabled: false

secretStore:
  enabled: false
localDb:
  enabled: true